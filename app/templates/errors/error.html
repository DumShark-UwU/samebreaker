<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — SameBreaker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050b14;
      color: #cce8f4;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #091828;
      border: 1px solid #0d2240;
      border-radius: 16px;
      padding: 40px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .code {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
      background: linear-gradient(135deg, #00b4d8, #0096b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #cce8f4;
      margin-bottom: 12px;
    }
    .message {
      font-size: 14px;
      color: #5a8fa8;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .detail {
      font-size: 12px;
      color: #3a6a8a;
      font-family: monospace;
      background: #050b14;
      border: 1px solid #0d2240;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      margin-bottom: 28px;
      word-break: break-all;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      background: #00b4d8;
      color: #050b14;
      border: none;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #0096b7; }
    .btn-sec {
      background: #0d2240;
      color: #5a8fa8;
      border: 1px solid #1a3a5c;
      margin-left: 10px;
    }
    .btn-sec:hover { border-color: #00b4d8; color: #cce8f4; }
    .divider {
      border: none;
      border-top: 1px solid #0d2240;
      margin: 28px 0;
    }
    .hint {
      font-size: 11px;
      color: #3a6a8a;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ code }}</div>
    <div class="title">{{ title }}</div>
    <p class="message">{{ message }}</p>

    {% if detail %}
    <div class="detail">{{ detail }}</div>
    {% endif %}

    <div>
      <a href="{{ url_for('main.index') }}" class="btn">← Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-sec">Retour</a>
    </div>

    <p class="hint">SameBreaker • Si le problème persiste, consultez les logs : <code>journalctl -u samebreaker -n 50</code></p>
  </div>
</body>
</html>
