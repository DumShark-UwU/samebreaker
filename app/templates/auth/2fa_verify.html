<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SameBreaker — Vérification 2FA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#050b14; color:#cce8f4; font-family:system-ui,sans-serif; }
    .field { width:100%; padding:10px 14px; border-radius:8px; background:#0d2240;
             border:1px solid #1a3a5c; color:#cce8f4; font-size:18px; outline:none; transition:.2s;
             letter-spacing:.3em; text-align:center; }
    .field:focus { border-color:#00b4d8; box-shadow:0 0 0 2px rgba(0,180,216,.15); }
    .field::placeholder { color:#5a8fa8; letter-spacing:normal; font-size:14px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-xs flex flex-col gap-5">

    <div class="text-center">
      <img src="/static/assets/logo.png" alt="SameBreaker" class="w-24 mx-auto mb-3" />
      <h1 class="text-lg font-bold" style="color:#00b4d8;">Vérification 2FA</h1>
      <p class="text-xs mt-1" style="color:#5a8fa8;">
        Bienvenue
        <span class="font-mono" style="color:#cce8f4;">{{ username }}</span>
        — entrez le code affiché par votre application TOTP.
      </p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="text-sm px-4 py-3 rounded-lg
        {% if cat == 'error' %}bg-red-900/40 text-red-400 border border-red-800
        {% else %}bg-green-900/40 text-green-400 border border-green-800{% endif %}">
        {{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="flex flex-col gap-4 p-6 rounded-xl border"
          style="background:#091828; border-color:#0d2240;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="flex flex-col gap-2">
        <label class="text-xs uppercase tracking-wider" style="color:#5a8fa8;">Code TOTP</label>
        <input name="code" class="field" required autofocus
               inputmode="numeric" pattern="\d{6}" maxlength="6"
               placeholder="000000" autocomplete="one-time-code" />
        <p class="text-xs text-center" style="color:#5a8fa8;">
          Le code change toutes les 30 secondes
        </p>
      </div>
      <button type="submit"
              class="w-full py-2.5 rounded-lg font-bold text-sm transition-all"
              style="background:#00b4d8; color:#050b14;">
        Vérifier
      </button>
    </form>

    <div class="text-center">
      <a href="{{ url_for('auth.login') }}" class="text-xs" style="color:#5a8fa8;">
        ← Retour connexion
      </a>
    </div>
  </div>
</body>
</html>
